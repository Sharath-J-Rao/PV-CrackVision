name: Build PV CrackVision Windows Desktop

on:
  push:
    branches:
      - 'release/v*-desktop'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python for training-worker checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability audit (production, report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Generate SBOM (CycloneDX)
        shell: pwsh
        run: npm sbom --omit dev --sbom-format cyclonedx --sbom-type application | Out-File -Encoding utf8 sbom.cdx.json
        continue-on-error: true

      - name: Install desktop packager
        run: npm install --no-save --no-package-lock electron@45.2.3 electron-builder@26.18.1

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=" + ($version -replace '-(\d+)$', '.$1') >> $env:GITHUB_OUTPUT

      - name: Release identity check
        run: node scripts/check-release-version.mjs

      - name: Third-party notices are current
        run: node scripts/generate-third-party-notices.mjs --check

      - name: Verify bundled AI models (required for the offline EXE)
        run: node scripts/model-manifest.mjs check --require

      - name: Strict TypeScript check
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Install Python test dependency
        run: python -m pip install numpy

      - name: Run Python training-worker tests
        run: npm run test:training-worker

      - name: Build production web assets
        run: npm run build

      - name: Build Windows installer (single EXE)
        run: npx electron-builder --win --x64 --config electron-builder.config.cjs --publish never
        env:
          # Code signing activates only when these protected secrets exist; unsigned builds still work without them.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify Windows deliverables
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop-dist -Filter *.exe -File
          if ($files.Count -ne 1) { throw "Expected exactly one EXE; found $($files.Count)." }
          if ($files[0].Length -ge 200MB) { throw "EXE is $([math]::Round($files[0].Length / 1MB, 1)) MB; must be under 200 MB." }
          $worker = Join-Path 'desktop-dist\win-unpacked\resources\app.asar.unpacked\training' 'train_cell_yolo.py'
          $dependencyHelper = Join-Path 'desktop-dist\win-unpacked\resources\app.asar.unpacked\training' 'install_package_dependencies.py'
          $bundledModels = 'desktop-dist\win-unpacked\resources\models'
          foreach ($m in @('cell.onnx','cellClassifier.onnx','cellClassifier.json','cellAnomaly.onnx','cellAnomaly.json','manifest.json')) { if (-not (Test-Path (Join-Path $bundledModels $m))) { throw "Bundled model missing from the package: $m" } }
          if (-not (Test-Path $worker)) { throw "YOLO Python worker was not unpacked for the external Python process: $worker" }
          if (-not (Test-Path $dependencyHelper)) { throw "Python dependency helper was not unpacked: $dependencyHelper" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($name in @("PV-CrackVision-$version-x64.exe")) {
            if (-not (Test-Path (Join-Path desktop-dist $name))) { throw "Missing expected deliverable: $name" }
          }
          $files | ForEach-Object { Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Smoke-test the packaged application
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem 'desktop-dist\win-unpacked' -Filter '*.exe' -File | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'Unpacked application executable not found.' }
          $env:PV_SMOKE_TEST = '1'
          $env:PV_EXPECT_VERSION = $version
          $env:PV_REQUIRE_MODELS = '1'
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          $log = Join-Path $env:APPDATA 'PV CrackVision\logs\desktop.log'
          if (-not $proc.WaitForExit(150000)) { $proc.Kill(); if (Test-Path $log) { Get-Content $log -Tail 80 } else { Write-Host "No desktop.log at $log" }; throw 'Smoke test timed out after 150 s.' }
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($proc.ExitCode -ne 0) { throw "Packaged app smoke test failed (exit code $($proc.ExitCode))." }

      - name: Upload desktop diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-log
          path: ${{ env.APPDATA }}/PV CrackVision/logs/desktop.log
          if-no-files-found: ignore

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $names = @("PV-CrackVision-$version-x64.exe")
          $lines = foreach ($n in $names) { $h = (Get-FileHash (Join-Path desktop-dist $n) -Algorithm SHA256).Hash.ToLower(); "$h  $n" }
          Set-Content -Path desktop-dist/SHA256SUMS.txt -Value $lines -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Upload desktop deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PV-CrackVision-v${{ steps.ver.outputs.label }}-Windows-x64
          path: |
            desktop-dist/PV-CrackVision-${{ steps.ver.outputs.version }}-x64.exe
            desktop-dist/SHA256SUMS.txt
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
